[project]
name = "infra-manager"
version = "0.0.0"
requires-python = "==3.14.*"
dependencies = [
  "aws-lambda-powertools>=3.37.0",
  "boto3>=1.43.118",
  "pulumi>=3.272.0",
  "pulumi-aws>=7.51.1",
  "pulumi-cloudflare>=6.23.1",
  "pulumiverse-time>=0.1.1",
  "pyawscron>=1.0.7",
  "pydantic>=2.14.1",
  "sst-sdk>=4.17.2",
  "types-boto3-lambda>=1.43.118",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
