[project]
name = "infra-manager"
version = "0.0.0"
requires-python = "==3.14.*"
dependencies = [
  "aws-lambda-powertools>=3.40.0",
  "boto3>=1.44.1",
  "pulumi>=3.274.1",
  "pulumi-aws>=7.54.0",
  "pulumi-cloudflare>=6.23.3",
  "pulumiverse-time>=0.1.1",
  "pyawscron>=1.0.7",
  "pydantic>=2.14.3",
  "sst-sdk>=4.17.2",
  "types-boto3-lambda>=1.44.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
